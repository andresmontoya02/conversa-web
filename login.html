<body class="login-pagina">

<div class="login-split">

    <div class="marca">
      <svg viewBox="0 0 100 100" width="30" height="30" fill="none" aria-hidden="true">

          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" placeholder="tu usuario" autocapitalize="none" spellcheck="false">

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <div class="campo-clave">
            <input id="contrasena" name="contrasena" type="password" autocomplete="current-password">

          </div>
        </div>
        <a class="login-olvido" id="login-olvido" href="#">¿Olvidaste tu contraseña?</a>
        <button class="btn btn-tinta login-entrar" type="submit">Entrar</button>
        <p class="login-aviso" id="login-aviso" aria-live="polite"></p>
      </form>

      <nav class="login-enlaces" aria-label="Ayuda y legales">

        <a href="terminos.html">Términos</a>
        <a href="privacidad.html">Privacidad</a>

    <a class="login-wa" href="https://wa.me/573053060656?text=Hola%2C%20necesito%20ayuda%20para%20entrar%20al%20panel" aria-label="Escribir a soporte por WhatsApp" target="_blank" rel="noopener noreferrer">
